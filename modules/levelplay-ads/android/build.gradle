plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'expo.modules.rowflarelevelplayads'
version = '1.0.0'

android {
  namespace "expo.modules.rowflarelevelplayads"
  defaultConfig {
    versionCode 1
    versionName '1.0.0'
    consumerProguardFiles 'consumer-rules.pro'
  }
}

dependencies {
  implementation 'com.unity3d.ads-mediation:mediation-sdk:9.5.0'
  implementation 'com.unity3d.ads-mediation:unityads-adapter:5.11.0'
  implementation 'com.unity3d.ads:unity-ads:4.19.0'
  implementation('com.unity3d.ads-mediation:adquality-sdk') {
    version {
      strictly '9.8.0'
    }
    because 'Unity Ads 4.19 declares a dynamic range; store builds must resolve reproducibly'
  }
  implementation 'com.google.android.gms:play-services-appset:16.0.0'
  implementation 'com.google.android.gms:play-services-ads-identifier:18.1.0'
  implementation 'com.google.android.gms:play-services-basement:18.1.0'
}
